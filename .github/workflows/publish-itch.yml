name: Publish to itch.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  ITCHIO_PROJECT: yata-andersen/minefield-beachhead
  ITCHIO_CHANNEL: html5

jobs:
  publish:
    name: Build, QA, and upload HTML5 build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static QA
        run: npm run qa:static

      - name: Build HTML5 game
        run: npm run build

      - name: Run browser playtest
        run: npm run playtest:preview

      - name: Set release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Upload to itch.io
        uses: robpc/itchio-upload-action@v1
        with:
          path: dist
          project: ${{ env.ITCHIO_PROJECT }}
          channel: ${{ env.ITCHIO_CHANNEL }}
          version: ${{ env.RELEASE_VERSION }}
          api-key: ${{ secrets.ITCHIO_API_KEY }}
